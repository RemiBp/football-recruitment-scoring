name: Reproducible analysis
on:
  push:
    paths: ['*.py', 'tests/**', '*requirements*.txt', '.github/workflows/**', 'dataset_final.parquet', 'schema.json']
  workflow_dispatch:
    inputs:
      run_models:
        description: Run model and stability analysis
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
  stability:
    if: github.event_name == 'workflow_dispatch' && inputs.run_models
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u stability.py --bootstraps 200
      - uses: actions/upload-artifact@v4
        with:
          name: stability-results
          path: reports/
          retention-days: 30
  foundation:
    if: github.event_name == 'workflow_dispatch' && inputs.run_models
    needs: integrity
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
      HF_HUB_DISABLE_XET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements-foundation.txt
      - run: python -u foundation.py
      - uses: actions/upload-artifact@v4
        with:
          name: foundation-results
          path: reports/foundation_*
          retention-days: 30
